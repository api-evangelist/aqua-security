description: FOCUS-aligned FinOps placeholder for Aqua Security. No public billing-model details, meters,
  or invoice schema are published; this artifact records the absence so consumers know to source commercial
  terms from the provider directly.
notes: Aqua Security uses consumption-based enterprise pricing — Dev Security is priced per code repository
  and Cloud Security per workload (EC2 instance, Fargate container, Lambda function, etc.). No public
  per-tier prices, free tier, or quotas are published; the pricing page directs prospects to Request a
  Trial / Get a Demo.
