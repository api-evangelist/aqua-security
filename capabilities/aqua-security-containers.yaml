naftiko: 1.0.0-alpha2
info:
  label: Aqua Security REST API — Containers
  description: 'Aqua Security REST API — Containers. 1 operations. Lead operation: Aqua Security List Containers. Self-contained
    Naftiko capability covering one Aqua Security business surface.'
  tags:
  - Aqua Security
  - Containers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AQUA_SECURITY_API_KEY: AQUA_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: aqua-security-containers
    baseUri: https://{tenant}.cloud.aquasec.com/api
    description: Aqua Security REST API — Containers business capability. Self-contained, no shared references.
    resources:
    - name: v1-containers
      path: /v1/containers
      operations:
      - name: listcontainers
        method: GET
        description: Aqua Security List Containers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by container status
        - name: page
          in: query
          type: integer
          description: Page number for pagination
        - name: pagesize
          in: query
          type: integer
          description: Number of results per page
    authentication:
      type: bearer
      token: '{{env.AQUA_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: aqua-security-containers-rest
    port: 8080
    description: REST adapter for Aqua Security REST API — Containers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/containers
      name: v1-containers
      description: REST surface for v1-containers.
      operations:
      - method: GET
        name: listcontainers
        description: Aqua Security List Containers
        call: aqua-security-containers.listcontainers
        with:
          status: rest.status
          page: rest.page
          pagesize: rest.pagesize
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aqua-security-containers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Aqua Security REST API — Containers. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: aqua-security-list-containers
      description: Aqua Security List Containers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: aqua-security-containers.listcontainers
      with:
        status: tools.status
        page: tools.page
        pagesize: tools.pagesize
      outputParameters:
      - type: object
        mapping: $.
