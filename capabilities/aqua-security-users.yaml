naftiko: 1.0.0-alpha2
info:
  label: Aqua Security REST API — Users
  description: 'Aqua Security REST API — Users. 1 operations. Lead operation: Aqua Security List Users. Self-contained Naftiko
    capability covering one Aqua Security business surface.'
  tags:
  - Aqua Security
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AQUA_SECURITY_API_KEY: AQUA_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: aqua-security-users
    baseUri: https://{tenant}.cloud.aquasec.com/api
    description: Aqua Security REST API — Users business capability. Self-contained, no shared references.
    resources:
    - name: v1-users
      path: /v1/users
      operations:
      - name: listusers
        method: GET
        description: Aqua Security List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.AQUA_SECURITY_API_KEY}}'
  exposes:
  - type: rest
    namespace: aqua-security-users-rest
    port: 8080
    description: REST adapter for Aqua Security REST API — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/users
      name: v1-users
      description: REST surface for v1-users.
      operations:
      - method: GET
        name: listusers
        description: Aqua Security List Users
        call: aqua-security-users.listusers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aqua-security-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Aqua Security REST API — Users. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: aqua-security-list-users
      description: Aqua Security List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: aqua-security-users.listusers
      outputParameters:
      - type: object
        mapping: $.
