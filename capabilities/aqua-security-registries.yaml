    port: 9090
    transport: http
    description: MCP adapter for Aqua Security REST API — Registries. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: aqua-security-list-registries
      description: Aqua Security List Registries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: aqua-security-registries.listregistries
      outputParameters:
      - type: object
        mapping: $.
